<body>
<div class="wrap">
<header class="hero">
<div class="brand">ACE • STUDENT SYSTEM</div>
<h1>Absensi Siswa 📚</h1><p>Scan QR kertas milikmu untuk absen</p>
<div class="clock"><div id="time">--:--:--</div><div id="date">Memuat tanggal...</div><span class="wib">🌏 Waktu Indonesia Barat (WIB)</span></div>
</header>
<section class="card">
<h2>📝 Form Absensi</h2>

<button type="button" class="scanBtn" id="btnScan">📷 Scan QR Kertas</button>
<div id="readerBox" class="readerBox">
  <div class="camTools">
    <button type="button" class="iconBtn" id="btnGaleri" aria-label="Pilih dari galeri">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <button type="button" class="iconBtn" id="btnTutupScan" aria-label="Tutup">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="reader"></div>
</div>
<input type="file" id="fileQR" accept="image/*" hidden>

<div id="identitas" class="identitas">
  <div><small>NAMA</small><b id="outNama">-</b></div>
  <div><small>KELAS</small><b id="outKelas">-</b></div>
</div>
<div id="hintNama" class="auto-hint"></div>

<div id="jadwalInfo" class="jadwalBox">Scan QR kertas untuk melihat jadwal hari ini</div>
<form id="form">
<label class="title">Mata Pelajaran</label>
<select id="mapel" required><option value="">-- Scan QR Dulu --</option></select>
<div id="hintMapel" class="auto-hint"></div>

<label class="title">Guru Mapel</label>
<select id="guru" required><option value="">-- Scan QR Dulu --</option></select>
<div id="hintGuru" class="auto-hint"></div>

<label class="title">Status Kehadiran</label>
<div class="status three">
  <label class="opt"><input type="radio" name="status" value="Hadir" required><span>✅ Hadir</span></label>
  <label class="opt"><input type="radio" name="status" value="Izin"><span>📩 Izin</span></label>
  <label class="opt"><input type="radio" name="status" value="Sakit"><span>🤒 Sakit</span></label>
</div>

<div id="ketBox" class="ketBox">
  <label class="title" for="keterangan">Keterangan Izin</label>
  <textarea id="keterangan" maxlength="200" rows="3" placeholder="Tulis alasan izin, contoh: acara keluarga"></textarea>
  <div class="ketHint"><span id="ketCount">0</span>/200</div>
</div>
<button class="send" id="send" type="submit">Kirim Absensi</button>
<div class="success" id="success"></div>
</form>
<p class="note">data tersimpan di DataBase</p>
</section>
<div class="footer">© <script>document.write(new Date().getFullYear())</script> • Made with 🖤 by ACE (ArilCode Engineer)</div>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./main.js"></script>
</body>
</html>
