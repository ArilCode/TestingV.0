<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>Dashboard data</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="gate" class="gate">
  <h1>Dashboard</h1>
  <p class="desc">Masuk untuk melihat data yang tertangkap.</p>
  <div class="field">
    <label for="aEmail">Email admin</label>
    <input id="aEmail" type="email" autocomplete="username">
  </div>
  <div class="field">
    <label for="aPass">Kata sandi</label>
    <input id="aPass" type="password" autocomplete="current-password">
  </div>
  <div class="errMsg" id="authErr"></div>
  <button class="cta" id="btnLogin">Masuk</button>
</div>

<div id="dash" class="hide">
  <header class="top">
    <div>
      <div class="title">Data masuk</div>
      <div class="sub" id="stat">0 total · 0 hari ini</div>
    </div>
    <div class="acts">
      <button class="mini" id="btnCsv">CSV</button>
      <button class="mini" id="btnOut">Keluar</button>
    </div>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Cari email, nama, nomor...">
  </div>

  <main id="list"></main>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
